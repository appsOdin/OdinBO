<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted

        # Front controller — all requests go through index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Deny access to everything outside public/
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Require all granted
    </Directory>

    # Security headers
    # Prevent MIME-type sniffing
    Header set X-Content-Type-Options "nosniff"
    Header always set X-Content-Type-Options "nosniff"

    # Clickjacking protection
    Header always set X-Frame-Options "SAMEORIGIN"

    # Legacy XSS filter (still useful for older browsers)
    Header always set X-XSS-Protection "1; mode=block"

    # Control referrer information sent to other origins
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Content Security Policy
    # - default-src self: only allow resources from the same origin
    # - script-src: allow self + inline scripts used by legacy templates
    # - style-src: allow self + inline styles required by Bootstrap patterns
    # - font-src: allow self + data URIs
    # - img-src: allow self + data URIs (signature pads use data: images)
    # - connect-src self: AJAX same-origin only
    # - frame-ancestors self: prevents embedding in iframes from other origins
    Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content;"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content;"

    # Strict Transport Security (HSTS) only for HTTPS requests
    SetEnvIfNoCase X-Forwarded-Proto "^https$" is_https=1
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=is_https
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTPS} == 'on'"

    # Disable server signature to avoid leaking Apache/PHP version
    Header always unset X-Powered-By
    Header always unset Server

    # Prevent caching of sensitive pages
    Header always set Cache-Control "no-store, no-cache, must-revalidate"
    Header always set Pragma "no-cache"

    # Permissions Policy — restrict access to browser features
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

    # Cross-origin hardening
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"

    ErrorLog  ${APACHE_LOG_DIR}/odinbo_error.log
    CustomLog ${APACHE_LOG_DIR}/odinbo_access.log combined
</VirtualHost>
