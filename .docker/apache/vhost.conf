<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted

        # Front controller — all requests go through index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Deny access to everything outside public/
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Require all granted
    </Directory>

    # Security headers
    # Prevent MIME-type sniffing
    Header always set X-Content-Type-Options "nosniff"

    # Clickjacking protection
    Header always set X-Frame-Options "SAMEORIGIN"

    # Legacy XSS filter (still useful for older browsers)
    Header always set X-XSS-Protection "1; mode=block"

    # Control referrer information sent to other origins
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Content Security Policy
    # - default-src self: only allow resources from the same origin
    # - script-src: allow self + Bootstrap CDN + SweetAlert2 CDN (used by vacation views)
    # - style-src: allow self + Bootstrap CDN + inline styles (Bootstrap requires it)
    # - font-src: allow self + data URIs
    # - img-src: allow self + data URIs (signature pads use data: images)
    # - connect-src self: AJAX calls only to same origin
    # - frame-ancestors self: prevents embedding in iframes from other origins
    Header always set Content-Security-Policy "\
default-src 'self'; \
script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; \
style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; \
font-src 'self' data:; \
img-src 'self' data:; \
connect-src 'self'; \
frame-ancestors 'self'; \
base-uri 'self'; \
form-action 'self';"

    # Strict Transport Security (HSTS) — enable only if serving over HTTPS
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # Disable server signature to avoid leaking Apache/PHP version
    Header always unset X-Powered-By
    Header always unset Server

    # Prevent caching of sensitive pages
    Header always set Cache-Control "no-store, no-cache, must-revalidate"
    Header always set Pragma "no-cache"

    # Permissions Policy — restrict access to browser features
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

    ErrorLog  ${APACHE_LOG_DIR}/odinbo_error.log
    CustomLog ${APACHE_LOG_DIR}/odinbo_access.log combined
</VirtualHost>
