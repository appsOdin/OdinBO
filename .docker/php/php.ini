; ─── OdinBO PHP settings ───────────────────────────────────────

; Timezone
date.timezone = America/Costa_Rica

; Session – file-based, stored in storage/sessions/
session.save_handler   = files
session.save_path      = /var/www/html/storage/sessions
session.gc_maxlifetime = 3600
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Error display – off in production, controlled by APP_DEBUG in code
display_errors  = Off
log_errors      = On
error_log       = /var/www/html/storage/logs/php_error.log

; Limits
max_execution_time = 60
memory_limit       = 128M
upload_max_filesize = 10M
post_max_size       = 12M

; cURL (used by ApiService)
; No extra ini needed – compiled in the image
